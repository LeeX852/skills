                  - paragraph [ref=e465]:
                    - strong [ref=e466]: L1 目录层
                - cell "name + description" [ref=e467]:
                  - paragraph [ref=e468]: name + description
                - cell "会话启动时" [ref=e469]:
                  - paragraph [ref=e470]: 会话启动时
                - cell "每个 Skill ~50-100 tokens" [ref=e471]:
                  - paragraph [ref=e472]: 每个 Skill ~50-100 tokens
              - row "L2 指令层 完整 SKILL.md body Skill 被激活时 建议 <5000 tokens" [ref=e473]:
                - cell "L2 指令层" [ref=e474]:
                  - paragraph [ref=e475]:
                    - strong [ref=e476]: L2 指令层
                - cell "完整 SKILL.md body" [ref=e477]:
                  - paragraph [ref=e478]: 完整 SKILL.md body
                - cell "Skill 被激活时" [ref=e479]:
                  - paragraph [ref=e480]: Skill 被激活时
                - cell "建议 <5000 tokens" [ref=e481]:
                  - paragraph [ref=e482]: 建议 <5000 tokens
              - row "L3 资源层 scripts/、references/、assets/ 中的文件 指令引用时按需 视文件大小" [ref=e483]:
                - cell "L3 资源层" [ref=e484]:
                  - paragraph [ref=e485]:
                    - strong [ref=e486]: L3 资源层
                - cell "scripts/、references/、assets/ 中的文件" [ref=e487]:
                  - paragraph [ref=e488]: scripts/、references/、assets/ 中的文件
                - cell "指令引用时按需" [ref=e489]:
                  - paragraph [ref=e490]: 指令引用时按需
                - cell "视文件大小" [ref=e491]:
                  - paragraph [ref=e492]: 视文件大小
          - paragraph [ref=e493]:
            - strong [ref=e494]: 关键价值：
            - text: 即使安装了 20 个 Skill，初始加载也仅 1000-2000 tokens。相比单体式提示词，上下文使用量减少约 90%。
          - paragraph [ref=e495]:
            - strong [ref=e496]: L1 层：
            - text: Agent 启动时只加载所有 Skill 的 name + description，以 XML 格式注入系统提示词。Agent 此时只知道有哪些 Skill 可用。
          - paragraph [ref=e497]:
            - strong [ref=e498]: L2 层：
            - text: 用户任务匹配某个 Skill 的描述时，Agent 读取完整 SKILL.md body。建议控制在 500 行以内。
          - paragraph [ref=e499]: L3 层： SKILL.md 中的指令引用外部文件时按需加载。关键是告诉 Agent 何时加载，如「当 API 返回非 200 时，读取 references/api-errors.md」。
          - paragraph [ref=e500]
          - heading "1.4 触发机制设计" [level=2] [ref=e501]
          - paragraph [ref=e502]:
            - text: Skill 的触发完全依赖 description 字段，由
            - strong [ref=e503]: 模型自主判断
            - text: 当前任务是否匹配（Model-driven Activation），而非关键词硬编码匹配。
          - paragraph [ref=e504]:
            - strong [ref=e505]: description 写作要点：
          - list [ref=e506]:
            - listitem [ref=e507]: 使用祈使语气：「Use this skill when...」
            - listitem [ref=e508]: 聚焦用户意图，而非 Skill 内部机制
            - listitem [ref=e509]: 适当「强势」，覆盖用户可能的各种表述
            - listitem [ref=e510]: 包含关键触发词
          - paragraph [ref=e511]: 好的例子：
          - generic [ref=e513]:
            - generic [ref=e518]:
              - generic [ref=e521]: Analyze CSV and tabular data files — compute summary statistics,
              - generic [ref=e524]: add derived columns, generate charts, and clean messy data. Use this
              - generic [ref=e527]: skill when the user has a CSV, TSV, or Excel file and wants to
              - generic [ref=e530]: explore, transform, or visualize the data, even if they don't
              - generic [ref=e533]: explicitly mention "CSV" or "analysis."
