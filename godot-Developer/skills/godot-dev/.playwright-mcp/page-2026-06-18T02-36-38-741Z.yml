          - heading "五、总结" [level=1] [ref=e2401]
          - paragraph [ref=e2402]: Skill 生态正在快速发展，已形成 规范标准（agentskills.io）→ 构建方法论（Anthropic/Superpowers）→ 设计模式（Google） 的完整知识体系。三个关键认知：
          - paragraph [ref=e2403]:
            - strong [ref=e2404]: 1.Skill 不是 Prompt
            - text: ，而是围绕任务、工具、流程和输出边界的结构化行为设计
          - paragraph [ref=e2405]:
            - strong [ref=e2406]: 2.渐进式加载是核心机制
            - text: ，解决了 Agent 系统的上下文膨胀问题
          - paragraph [ref=e2407]:
            - strong [ref=e2408]: 3.描述是触发的关键
            - text: ，写好 description 比写好指令主体更重要
