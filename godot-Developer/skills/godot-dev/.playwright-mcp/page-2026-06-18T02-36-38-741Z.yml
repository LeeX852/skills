          - paragraph [ref=e234]:
            - strong [ref=e235]: 1.2.1 name 字段的命名规则
          - paragraph [ref=e236]: name 字段有严格的命名规则：
          - list [ref=e237]:
            - listitem [ref=e238]: 必须为 1-64 个字符
            - listitem [ref=e239]:
              - text: 只能包含 Unicode 小写字母数字字符（
              - code [ref=e240]: a-z
              - text: ）和连字符（
              - code [ref=e241]: "-"
              - text: ）
            - listitem [ref=e242]:
              - text: 不能以连字符 (
              - code [ref=e243]: "-"
              - text: )开头或结尾
            - listitem [ref=e244]:
              - text: 不得包含连续的连字符（
              - code [ref=e245]: "--"
              - text: ）
            - listitem [ref=e246]: 必须与父目录名称匹配
          - paragraph [ref=e247]: 合法示例：
          - generic [ref=e249]:
            - generic [ref=e254]:
              - generic [ref=e257]: "name: pdf-processing"
              - generic [ref=e260]: "name: data-analysis"
              - generic [ref=e263]: "name: code-review"
            - generic [ref=e266] [cursor=pointer]: 
          - paragraph [ref=e269]: 非法示例：
          - generic [ref=e271]:
            - generic [ref=e276]:
              - generic [ref=e279]: "name: PDF-Processing # 不允许大写字母"
              - generic [ref=e282]: "name: -pdf # 不能以连字符开头"
              - generic [ref=e285]: "name: pdf--processing # 不允许连续连字符"
            - generic [ref=e288] [cursor=pointer]: 
          - paragraph [ref=e291]:
            - strong [ref=e292]: 1.2.2 description 字段的写法建议
          - paragraph [ref=e293]: description 应该清晰描述 Skill 的功能和适用场景：
          - list [ref=e294]:
            - listitem [ref=e295]: 必须为 1-1024 个字符
            - listitem [ref=e296]: 应该描述该技能的作用以及何时使用。
            - listitem [ref=e297]: 应包含有助于代理识别相关任务的特定关键词。
          - paragraph [ref=e298]: 好的示例：
          - generic [ref=e300]:
            - generic [ref=e308]: "description: Extracts text and tables from PDF files, fills PDF forms, and merges multiple PDFs. Use when working with PDF documents or when the user mentions PDFs, forms, or document extraction."
            - generic [ref=e311] [cursor=pointer]: 
          - paragraph [ref=e314]: 差的示例：
          - generic [ref=e316]:
            - generic [ref=e324]: "description: Helps with PDFs."
            - generic [ref=e327] [cursor=pointer]: 
          - paragraph [ref=e330]:
            - strong [ref=e331]: 1.2.3 Markdown 正文内容
          - paragraph [ref=e332]: 元数据之后的 Markdown 正文部分就是 Skill 的核心指令。对正文格式没有硬性限制，只要能帮助 AI 有效执行任务即可。
          - paragraph [ref=e333]: 建议包含以下内容：分步骤的操作说明、输入输出示例、常见边界情况处理。
          - paragraph [ref=e334]: 建议正文控制在 500 行以内。如果内容较多，可以把详细的参考资料拆分到单独的文件中。
          - paragraph [ref=e335]:
            - strong [ref=e336]: 1.2.4 最简示例
          - paragraph [ref=e337]: 一个最简的 SKILL.md 只需要 name 和 description：
          - generic [ref=e339]:
            - generic [ref=e344]:
              - generic [ref=e347]: "---"
              - generic [ref=e350]: "name: skill-name"
              - generic [ref=e353]: "description: A description of what this skill does and when to use it."
              - generic [ref=e356]: "---"
            - generic [ref=e359] [cursor=pointer]: 
          - paragraph [ref=e362]:
            - strong [ref=e363]: 1.2.5 包含可选字段的示例
          - generic [ref=e365]:
            - generic [ref=e370]:
              - generic [ref=e373]: "---"
              - generic [ref=e376]: "name: pdf-processing"
              - generic [ref=e379]: "description: Extract PDF text, fill forms, merge files. Use when handling PDFs."
              - generic [ref=e382]: "license: Apache-2.0"
              - generic [ref=e385]: "metadata:"
              - generic [ref=e388]: "author: example-org"
              - generic [ref=e391]: "version: \"1.0\""
              - generic [ref=e394]: "---"
              - generic [ref=e399]: "# PDF Processing"
              - generic [ref=e404]: "## When to use this skill"
              - generic [ref=e407]: Use this skill when the user needs to work with PDF files...
              - generic [ref=e412]: "## How to extract text"
              - generic [ref=e415]: 1. Use pdfplumber for text extraction...
            - generic [ref=e418] [cursor=pointer]: 
          - paragraph [ref=e421]:
            - strong [ref=e422]: 1.2.6 文件引用规范
          - paragraph [ref=e423]: 在 SKILL.md 中引用其他文件时，请使用相对于 Skill 根目录的路径。例如：
          - list [ref=e424]:
            - listitem [ref=e425]: 引用参考文档：references/REFERENCE.md
            - listitem [ref=e426]: 引用脚本：scripts/extract.py
          - paragraph [ref=e427]: 建议文件引用保持在一层深度，避免深层嵌套的引用链。
          - paragraph [ref=e428]:
            - strong [ref=e429]: 1.2.7 可选目录结构
          - paragraph [ref=e430]:
            - strong [ref=e431]: scripts/ 目录
          - paragraph [ref=e432]: 存放 AI 可以运行的可执行代码。脚本应该是自包含的或明确说明依赖关系，包含有用的错误提示信息，并能妥善处理边界情况。常见支持的语言包括 Python、Bash 和 JavaScript。
          - paragraph [ref=e433]:
            - strong [ref=e434]: references/ 目录
          - paragraph [ref=e435]: 存放 AI 在需要时可以读取的补充文档，例如：REFERENCE.md（详细技术参考）、FORMS.md（表单模板或结构化数据格式）、或特定领域的文档（如 finance.md、legal.md）。
          - paragraph [ref=e436]: 建议每个参考文件保持聚焦，因为 AI 是按需加载这些文件的，文件越小，消耗的上下文越少。
          - paragraph [ref=e437]:
            - strong [ref=e438]: assets/ 目录
          - paragraph [ref=e439]: 存放静态资源文件，包括：模板文件（文档模板、配置模板）、图片（示意图、示例图）、数据文件（查找表、Schema 定义）。
          - paragraph [ref=e440]
          - heading "1.3 三层渐进式加载机制" [level=2] [ref=e441]
          - paragraph [ref=e442]: 这是 Agent Skills 规范最精妙的设计，借鉴了 UI/UX 领域的渐进式信息披露策略：
          - table [ref=e447]:
            - rowgroup [ref=e453]:
              - row "层级 加载内容 加载时机 Token 成本" [ref=e454]:
                - cell "层级" [ref=e455]:
