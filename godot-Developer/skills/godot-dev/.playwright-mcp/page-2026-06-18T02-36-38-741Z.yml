        - generic [ref=e99]: 简介： 文章从 Skill 的规范格式、三层渐进式加载机制、模型驱动触发逻辑出发，深入解析 Skill-Creator 的工程化开发范式。（文章内容基于作者个人技术实践与独立思考，旨在分享经验，仅代表个人观点。）
        - generic [ref=e106]:
          - heading "前言" [level=1] [ref=e107]
          - paragraph [ref=e108]: Skill 不是 Prompt——它是围绕任务、工具、流程和输出边界的结构化行为设计。 写好 Skill 的关键在于理解规范标准、掌握构建方法论、选择合适的设计模式。
          - paragraph [ref=e109]:
            - generic [ref=e116]:
              - img [ref=e117]
              - text: 
          - paragraph [ref=e118]
          - heading "一、Skill 规范标准" [level=1] [ref=e119]
          - heading "1.1 什么是 Agent Skill" [level=2] [ref=e120]
          - paragraph [ref=e121]: 在 AI Agent 生态中，Skill 是一种可复用的 Prompt 增强包，通过渐进式加载机制为 Agent 注入领域知识和工作流程。2025 年 12 月，Anthropic 将 Skill 规范作为开放标准发布，目前已被 33+ 个 Agent 产品采纳，包括 Claude Code、OpenAI Codex、GitHub Copilot、VS Code、Cursor、Gemini CLI、Kiro 等。
          - paragraph [ref=e122]: 一个 Skill 的最小形态只需要一个文件：
          - generic [ref=e124]:
            - generic [ref=e129]:
              - generic [ref=e132]: skill-name/
              - generic [ref=e135]: "├── SKILL.md # 必需：YAML 元数据 + Markdown 指令"
              - generic [ref=e138]: "├── scripts/ # 可选：可执行脚本"
              - generic [ref=e141]: "├── references/ # 可选：按需加载的参考文档"
              - generic [ref=e144]: "└── assets/ # 可选：模板、资源文件"
            - generic [ref=e147] [cursor=pointer]: 
          - paragraph [ref=e150]
          - heading "1.2 SKILL 格式规范" [level=2] [ref=e151]
          - paragraph [ref=e152]: 根据Anthropic提出的规范，SKILL.md 由 YAML frontmatter（元数据） 和 Markdown body（指令正文） 两部分组成。
          - paragraph [ref=e153]: YAML frontmatter 字段：
