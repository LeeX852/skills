          - heading "问题一：Token 消耗极高，成本不透明" [level=5] [ref=e1395]:
            - strong [ref=e1396]: 问题一：Token 消耗极高，成本不透明
          - paragraph [ref=e1397]: 这是社区反映最集中的问题，有真实数据为证。
          - paragraph [ref=e1398]:
            - strong [ref=e1399]: "GitHub Issue #514"
            - text: （2026-03-04，来自
            - code [ref=e1400]: anthropics/claude-plugins-official
            - text: ）：
          - paragraph [ref=e1401]: "\"A single description optimization run with 20 eval queries (3 runs each = 60 sessions) consumed ~69% of a 5-hour time block, with 0 actionable results.\"— jroy-poka, GitHub Issue #514"
          - paragraph [ref=e1402]:
            - strong [ref=e1403]: 问题根源：
            - code [ref=e1404]: SKILL.md
            - text: 第 385 行指示
            - code [ref=e1405]: run_loop.py
            - text: 使用
            - code [ref=e1406]: "--model <session-model>"
            - text: ，即当前会话所用的模型。当用户使用 Opus 会话时，description 优化会启动 60+ 个 Opus 级别的
            - code [ref=e1407]: claude -p
            - text: 子进程，而触发检测本质上只是一个"是/否"的二元信号，完全不需要 Opus 级别的推理能力。
          - paragraph [ref=e1408]:
            - strong [ref=e1409]: 量化影响：
          - list [ref=e1410]:
            - listitem [ref=e1411]: 20 个评估查询 × 3 次运行 = 60 个并发 Opus 会话
            - listitem [ref=e1412]: 单次优化循环消耗约 69% 的 5 小时配额
            - listitem [ref=e1413]: 用户在触发前对成本完全没有预期
          - paragraph [ref=e1414]:
            - text: 社区建议的修复方案是将 eval 默认模型改为
            - code [ref=e1415]: claude-haiku
            - text: （成本降低 10-20 倍，触发检测精度等价），但截至当前该问题仍处于 Open 状态。
          - heading "问题二：流程冗长，用户需多次确认" [level=5] [ref=e1416]:
            - strong [ref=e1417]: 问题二：流程冗长，用户需多次确认
          - paragraph [ref=e1418]: Skill-Creator 的完整流程涉及大量交互节点：
          - generic [ref=e1420]:
            - generic [ref=e1425]:
              - generic [ref=e1428]: 需求确认 → Skill 草稿确认 → 测试用例确认 → 并行运行（等待）
              - generic [ref=e1431]: → 断言起草确认 → 评审 Viewer → 反馈提交 → 改进确认 → 再次运行...
            - generic [ref=e1434] [cursor=pointer]: 
          - paragraph [ref=e1437]: 每一轮迭代都需要用户：
          - paragraph [ref=e1438]: 1.在浏览器中逐个查看测试用例输出
          - paragraph [ref=e1439]: 2.为每个输出撰写文字反馈
          - paragraph [ref=e1440]:
            - text: 3.提交
            - code [ref=e1441]: feedback.json
          - paragraph [ref=e1442]: 4.回到对话告知 Claude 已完成
          - paragraph [ref=e1443]: 对于简单的 Skill（如一个格式转换工具），这套流程的开销远超 Skill 本身的价值。社区中有用户直接表示："对于简单需求，直接手写 SKILL.md 比用 skill-creator 快得多。"
          - heading "问题三：子任务数量庞大，并发管理复杂" [level=5] [ref=e1444]:
            - strong [ref=e1445]: 问题三：子任务数量庞大，并发管理复杂
          - paragraph [ref=e1446]: 一次完整的评测包含：
          - list [ref=e1447]:
            - listitem [ref=e1448]: N 个测试用例 × 2（with_skill + without_skill） 个执行子 Agent
            - listitem [ref=e1449]: N 个 Grader 子 Agent（评分）
            - listitem [ref=e1450]: 1 个 Analyzer 子 Agent（分析）
            - listitem [ref=e1451]: 可选：N 个 Comparator 子 Agent（盲比较）
          - paragraph [ref=e1452]: 以 3 个测试用例为例，单轮评测就会产生 6 个执行 + 3 个评分 + 1 个分析 = 10 个子 Agent。多轮迭代下子任务数量呈线性增长，在 Claude Code 的子 Agent 并发限制下容易出现排队等待。
          - heading "问题四：Description 优化对\"操作型 Skill\"效果有限" [level=5] [ref=e1453]:
            - strong [ref=e1454]: 问题四：Description 优化对"操作型 Skill"效果有限
          - paragraph [ref=e1455]: "GitHub Issue #514 中还指出了一个深层问题："
          - paragraph [ref=e1456]: "\"operational workflow skills show 0% recall regardless of description quality\""
          - paragraph [ref=e1457]: 对于某些"操作型"Skill（如"运行部署脚本"、"生成日报"），Claude 本身就能直接处理，不会主动去查询 Skill，导致触发率始终为 0%，description 优化完全无效。这类 Skill 的触发机制与 description 质量无关，而是取决于任务的复杂度和专业性。
          - heading "问题五：Skill 膨胀风险" [level=5] [ref=e1458]:
            - strong [ref=e1459]: 问题五：Skill 膨胀风险
          - paragraph [ref=e1460]: 来自 Medium 社区的观察（Claude Code Skills Deep Dive）：
          - paragraph [ref=e1461]: "\"A 5KB skill balloons to 50KB. Response times slow to a crawl. Maintenance becomes a nightmare. Your once-elegant skill has become a bloated monster.\""
          - paragraph [ref=e1462]: 随着迭代改进，Skill 有膨胀倾向——每次改进都可能增加新的指令、示例、边界情况处理，最终导致 Skill 体积失控，违背"保持精简"的初衷。
          - heading "问题六：学习曲线陡峭" [level=5] [ref=e1463]:
            - strong [ref=e1464]: 问题六：学习曲线陡峭
          - paragraph [ref=e1465]: Skill-Creator 的完整使用需要理解：
          - list [ref=e1466]:
            - listitem [ref=e1467]: Skill 的三层加载机制
            - listitem [ref=e1468]: JSON Schema 体系（7 种数据结构）
            - listitem [ref=e1469]: 子 Agent 的工作原理
            - listitem [ref=e1470]: 触发率评估的统计含义
            - listitem [ref=e1471]: 训练/测试集分割的防过拟合逻辑
          - paragraph [ref=e1472]: 对于非技术背景的用户，这套体系的认知负担相当高。
          - paragraph [ref=e1473]
          - heading "三、Writing-Skills 核心思想" [level=1] [ref=e1474]
          - heading "3.1 Superpowers 框架概述" [level=2] [ref=e1475]
          - paragraph [ref=e1476]: Superpowers 是一个专门为 Claude Code、Cursor、Codex 等 AI 编程助手设计的结构化工作流框架，定位是「Vibe Engineering」——在 AI 快速迭代的基础上强制注入软件工程纪律。
          - paragraph [ref=e1477]: 框架包含 14 个可组合的 Skill，覆盖从头脑风暴到代码交付的完整开发流程。核心理念：
          - list [ref=e1478]:
            - listitem [ref=e1479]: 测试先行（Test-Driven Development）
            - listitem [ref=e1480]: 系统化优于随机化（Process over Guessing）
            - listitem [ref=e1481]: 复杂度缩减（Simplicity as Primary Goal）
            - listitem [ref=e1482]: 证据优于声明（Verify before Declaring Success）
          - paragraph [ref=e1483]
          - heading "3.2 Writing-Skills 的核心定位" [level=2] [ref=e1484]
          - paragraph [ref=e1485]: Writing-Skills 是 Superpowers 中的元技能——教 Agent 如何创建新的 Skill。它与 Anthropic 的 skill-creator 目标相似，但方法论截然不同。
