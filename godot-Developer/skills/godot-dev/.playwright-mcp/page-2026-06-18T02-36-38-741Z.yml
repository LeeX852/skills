              - generic [ref=e2257]: "## 第一步 — 解析与清点"
              - generic [ref=e2260]: 分析代码，提取所有公开 API，以清单形式呈现。
              - generic [ref=e2263]: 询问："这是完整的公开 API 列表吗？"
              - generic [ref=e2268]: "## 第二步 — 生成文档字符串"
              - generic [ref=e2271]: 针对每个缺少文档字符串的函数，生成内容并提交用户确认。
              - generic [ref=e2274]: 在用户确认之前，不得进入第三步。
              - generic [ref=e2279]: "## 第三步 — 组装文档"
              - generic [ref=e2282]: 加载模板，将所有内容汇编为统一的 API 参考文档。
              - generic [ref=e2287]: "## 第四步 — 质量检查"
              - generic [ref=e2290]: 对照清单进行审查，在呈现最终文档之前修复所有问题。
            - generic [ref=e2293] [cursor=pointer]: 
          - paragraph [ref=e2296]:
            - strong [ref=e2297]: 关键：
            - text: Step 2 → Step 3 的 【确认前不得继续】 是硬性约束——用户不点头，Agent 不能往下走。
          - paragraph [ref=e2298]:
            - strong [ref=e2299]: 适用场景：
            - text: 从代码生成文档、多阶段内容生产、需要人工检查点的自动化流程。
