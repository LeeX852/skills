            - code [ref=e540]: Helps with PDFs.
          - paragraph [ref=e541]
          - heading "二、Skill-Creator 核心思想" [level=1] [ref=e542]
          - heading "2.1 设计哲学" [level=2] [ref=e543]
          - paragraph [ref=e544]: Skill-Creator是 Anthropic 官方的「用来创建 Skill 的 Skill」，其设计哲学可以概括为：像做机器学习一样做 Prompt Engineering —— 有训练集、测试集、评估指标、迭代优化循环、防过拟合机制。
          - paragraph [ref=e545]: 它将软件工程中的 CI/CD、A/B 测试、性能基准等最佳实践，完整移植到 Skill 开发领域。
          - paragraph [ref=e546]:
            - generic [ref=e553]:
              - img
              - text: 
          - paragraph [ref=e554]
          - heading "2.2 核心思想" [level=2] [ref=e555]
          - paragraph [ref=e556]:
            - strong [ref=e557]: 1.泛化而非过拟合。
            - text: Skill 要被使用无数次、面对无数种 prompt。如果只为测试用例做针对性修改，skill 就废了。遇到顽固问题，尝试换个隐喻或推荐不同的工作模式，而不是加更多死板约束。
          - paragraph [ref=e558]:
            - strong [ref=e559]: 2.解释"为什么"而非堆砌"必须"。
            - text: 这是全文最核心的洞察。今天的 LLM 有良好的心智理论，与其写满大写的 ALWAYS 和 NEVER，不如解释清楚为什么某件事重要。
          - paragraph [ref=e560]:
            - strong [ref=e561]: 3.提取重复模式。
            - text: 如果所有测试用例中 Agent 都独立写了类似的辅助脚本（比如都写了 create_docx.py），这是一个强信号——应该把这个脚本放到 scripts/ 目录，让 skill 直接调用。
          - paragraph [ref=e562]
          - heading "2.3 完整开发生命周期" [level=2] [ref=e563]
          - paragraph [ref=e564]: Skill-Creator 定义了六个阶段的闭环流程：
          - paragraph [ref=e565]:
            - strong [ref=e566]: 阶段一：需求捕获
            - text: → 理解意图、明确触发场景、确定输出格式、区分客观可验证 vs 主观创意型
          - paragraph [ref=e567]:
            - strong [ref=e568]: 阶段二：编写 Skill
            - text: → 编写 SKILL.md（含 YAML frontmatter + 指令主体）+ 准备辅助资源
          - paragraph [ref=e569]:
            - strong [ref=e570]: 阶段三：测试执行
            - text: → 设计 2-3 个测试用例 → 并行启动 with_skill 和 without_skill 两组子 Agent（A/B 测试）→ 利用等待时间起草量化断言 → 捕获 timing 数据
          - paragraph [ref=e571]:
            - strong [ref=e572]: 阶段四：评估与评审
            - text: → Grader 评分 → 聚合基准数据 → Analyzer 分析模式 → 生成 Eval Viewer → 用户在浏览器中评审 → 收集 feedback.json
          - paragraph [ref=e573]:
            - strong [ref=e574]: 阶段五：迭代改进
            - text: → 分析反馈 → 泛化改进方向（避免过拟合）→ 重写 Skill → 新 iteration 目录 → 回到阶段三
          - paragraph [ref=e575]:
            - strong [ref=e576]: 阶段六：优化与发布
            - text: → Description 优化（run_loop.py）→ 训练/测试集分割 → 自动迭代改进描述 → 校验 → 打包 .skill 文件
          - paragraph [ref=e577]
          - heading "2.4 Agent 系统 — 三个专业化角色" [level=2] [ref=e578]
          - paragraph [ref=e579]: Skill-Creator 设计了三个独立的子 Agent，各司其职，形成完整的评估链。
          - paragraph [ref=e580]:
            - strong [ref=e581]: 2.4.1 Grader Agent（评分者）
          - paragraph [ref=e582]:
            - strong [ref=e583]: 职责：
            - text: 评估断言是否通过，并评价评估本身。
          - paragraph [ref=e584]:
            - strong [ref=e585]: 8 步流程：
            - text: 读 Transcript → 检查输出文件 → 评估断言 → 提取隐含声明 → 读执行者笔记 → 评价评估本身 → 写结果 → 读指标数据
          - paragraph [ref=e586]:
            - strong [ref=e587]: 最精妙的设计是"自我批评"：
          - paragraph [ref=e588]: "\"A passing grade on a weak assertion is worse than useless — it creates false confidence.\""
          - paragraph [ref=e589]: 对一个薄弱断言给出"通过"的评级，其危害比毫无用处还要糟糕——它会制造出虚假的信心。
          - paragraph [ref=e590]: Grader 不仅评分，还会指出断言本身的问题：
          - list [ref=e591]:
            - listitem [ref=e592]: 一个通过的断言是否太容易满足（如只检查文件名存在，不检查内容）
            - listitem [ref=e593]: 是否有重要结果没有被任何断言覆盖
            - listitem [ref=e594]: 断言是否无法从可用输出中验证
          - paragraph [ref=e595]:
            - strong [ref=e596]: 评分标准：
          - list [ref=e597]:
            - listitem [ref=e598]: PASS：不仅要有证据，还要证据反映"真正的任务完成"，而非"表面合规"
            - listitem [ref=e599]: FAIL：包括"巧合通过"——断言技术上满足了，但底层任务结果是错的
          - paragraph [ref=e600]:
            - strong [ref=e601]: 2.4.2 Comparator Agent（盲比较者）
          - paragraph [ref=e602]:
            - strong [ref=e603]: 职责：
            - text: 在不知道哪个输出来自哪个 Skill 的情况下，判断哪个更好。
          - paragraph [ref=e604]:
            - strong [ref=e605]: 核心设计——去偏见化：
            - text: 借鉴医学实验中的双盲实验思想，Comparator 只看到 A 和 B，不知道来源。
          - paragraph [ref=e606]: 双维度评分体系：
          - list [ref=e607]:
            - listitem [ref=e608]:
              - strong [ref=e609]: 内容维度：
              - text: 正确性、完整性、准确性（各 1-5 分）
            - listitem [ref=e610]:
              - strong [ref=e611]: 结构维度：
              - text: 组织性、格式化、可用性（各 1-5 分）
            - listitem [ref=e612]: 综合为 1-10 的总分
          - paragraph [ref=e613]:
            - strong [ref=e614]: 判定优先级：
            - text: 总分 > 断言通过率 > 平局（极少出现）
          - paragraph [ref=e615]:
            - strong [ref=e616]: 2.4.3 Analyzer Agent（分析者）
          - paragraph [ref=e617]: 双重角色：
          - paragraph [ref=e618]:
            - strong [ref=e619]: 角色 A — 事后分析器：
            - text: 在盲比较后"揭盲"，分析 WHY 赢家赢了：
          - list [ref=e620]:
            - listitem [ref=e621]: 对比两个 Skill 的指令差异和执行模式差异
            - listitem [ref=e622]: 生成按优先级排序的改进建议（high / medium / low）
            - listitem [ref=e623]: 按类别分类：instructions、tools、examples、error_handling、structure、references
          - paragraph [ref=e624]: 角色 B — 基准分析器：分析聚合统计数据隐藏的模式：
          - list [ref=e625]:
            - listitem [ref=e626]: 哪些断言在两种配置下都 100% 通过？
            - listitem [ref=e627]: 哪些断言高方差？
            - listitem [ref=e628]: 时间/token 的异常值
          - paragraph [ref=e629]
          - heading "2.5 数据流与 JSON Schema 体系" [level=2] [ref=e630]
          - paragraph [ref=e631]:
